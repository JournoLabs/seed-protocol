name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Also applies patches/ (the thirdweb remapping Hardhat 3 needs to build).
      - run: bun install --frozen-lockfile

      # Compiles contracts and generates the TypeChain types the type-check needs.
      - run: bun run build

      - run: bun run typecheck

      - run: bun run test
